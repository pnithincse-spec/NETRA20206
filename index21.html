<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA Robot Monitoring System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-logo">N</div>
            <div>
                <h1>NETRA</h1>
                <p>ROBOT MISSION CONTROL</p>
            </div>
        </div>
        <nav>
            <a href="#dashboard">Dashboard</a>
            <a href="#fleet">Fleet</a>
            <a href="#telemetry">Telemetry</a>
            <a href="#alerts">Alerts</a>
        </nav>
        <div class="header-right">
            <span class="online-dot"></span>
            <strong>SYSTEM ONLINE <span id="clock">--:--:--</span></strong>
            <button id="dispatch-open" type="button">+ Dispatch Mission</button>
        </div>
    </header>
    <script src="/script21.js"></script>
    <main id="dashboard" class="page">
        <section class="kpi-grid">
            <article class="kpi-card">
                <span>ROVERS ONLINE</span>
                <h2 id="online-count">6 / 6</h2>
                <p>Active rover units</p>
            </article>
            <!-- all dashboard sections go here -->
        </section>
    </main>    
    <script src="script.js"></script>
</body>
</html>
